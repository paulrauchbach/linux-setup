# Keep terminal rendering predictable in Alacritty/GNOME.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:extkeys,alacritty:RGB:extkeys"

# Forward extended keys (CSI u) so apps see Ctrl/Shift+Enter, Ctrl+., etc.
set -g extended-keys on

# Copy-mode yanks reach the system clipboard via OSC 52, but ignore
# clipboard writes from programs running inside tmux.
set -g set-clipboard external

# Usability defaults.
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vi keys in copy mode.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Simple, legible status line.
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bold]#S #[default]"
set -g status-right "%Y-%m-%d %H:%M "
set -g window-status-current-format "#[bold] #I:#W "
