# Managed by linux-setup (configs/tmux/tmux.conf).

# Keep terminal rendering predictable in Alacritty/GNOME.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:extkeys,alacritty:RGB:extkeys"

# Forward extended keys (CSI u) so apps see Ctrl/Shift+Enter, Ctrl+., etc.
set -g extended-keys on

# Copy-mode yanks reach the system clipboard via OSC 52, but ignore
# clipboard writes from programs running inside tmux.
set -g set-clipboard external

# Usability defaults.
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g display-time 2500
set -g repeat-time 500
set -g status-keys vi

# Friendlier prefix while keeping the stock Ctrl-b binding available.
set -g prefix C-a
bind C-a send-prefix
bind C-b send-prefix

# Fast config reload.
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Split panes in the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Open new windows and panes in the current directory.
bind c new-window -c "#{pane_current_path}"

# Vi keys in copy mode.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Catppuccin Mocha palette, aligned with VS Code and the terminal font setup.
thm_bg="#1e1e2e"
thm_surface="#313244"
thm_overlay="#6c7086"
thm_text="#cdd6f4"
thm_subtext="#a6adc8"
thm_lavender="#b4befe"
thm_blue="#89b4fa"
thm_sapphire="#74c7ec"
thm_green="#a6e3a1"
thm_peach="#fab387"
thm_red="#f38ba8"
thm_mauve="#cba6f7"
thm_crust="#11111b"

# Calm borders and readable tmux prompts.
set -g mode-style "fg=${thm_crust},bg=${thm_blue},bold"
set -g message-style "fg=${thm_text},bg=${thm_surface}"
set -g message-command-style "fg=${thm_text},bg=${thm_surface}"
set -g pane-border-style "fg=${thm_surface}"
set -g pane-active-border-style "fg=${thm_blue}"

# Polished status line with useful context but low visual noise.
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-left-length 64
set -g status-right-length 120
set -g status-justify left
set -g status-style "fg=${thm_subtext},bg=${thm_bg}"
set -g status-left "#[fg=${thm_crust},bg=${thm_mauve},bold] #S #[fg=${thm_mauve},bg=${thm_surface}]#[fg=${thm_text},bg=${thm_surface}] #{?client_prefix, PREFIX , #[fg=${thm_subtext}]#(whoami) }#[fg=${thm_surface},bg=${thm_bg}] "
set -g status-right "#[fg=${thm_surface},bg=${thm_bg}]#[fg=${thm_text},bg=${thm_surface}] #(hostname -s) #[fg=${thm_blue},bg=${thm_surface}]#[fg=${thm_crust},bg=${thm_blue},bold] %H:%M #[fg=${thm_mauve},bg=${thm_blue}]#[fg=${thm_crust},bg=${thm_mauve},bold] %a %d %b "

setw -g window-status-separator ""
setw -g window-status-style "fg=${thm_subtext},bg=${thm_bg}"
setw -g window-status-format "#[fg=${thm_bg},bg=${thm_bg}]#[fg=${thm_subtext},bg=${thm_bg}] #I:#W#{?window_flags,#{window_flags},} "
setw -g window-status-current-format "#[fg=${thm_green},bg=${thm_bg}]#[fg=${thm_crust},bg=${thm_green},bold] #I:#W#{?window_flags,#{window_flags},} #[fg=${thm_green},bg=${thm_bg}]"
setw -g window-status-activity-style "fg=${thm_peach},bg=${thm_bg}"
set -g window-style "fg=${thm_text},bg=default"
set -g window-active-style "fg=${thm_text},bg=default"

# Plugin layer. Install with prefix + I after first launch; linux-setup also
# clones TPM so this binding is immediately available.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

if-shell '[ -x "$HOME/.tmux/plugins/tpm/tpm" ]' 'run "$HOME/.tmux/plugins/tpm/tpm"'
