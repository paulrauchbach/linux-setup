# Managed by linux-setup (configs/alacritty.toml).

[env]
TERM = "xterm-256color"

[window]
blur = false
decorations = "None"
dynamic_padding = false
opacity = 0.96
padding = {x = 8, y = 8}
startup_mode = "Maximized"

[scrolling]
history = 10000

[font]
bold = {family = "JetBrainsMono Nerd Font", style = "Heavy Italic"}
bold_italic = {family = "JetBrainsMono Nerd Font", style = "Heavy"}
italic = {family = "JetBrainsMono Nerd Font", style = "Medium Italic"}
normal = {family = "JetBrainsMono Nerd Font", style = "Medium"}
size = 11.0

[selection]
save_to_clipboard = false # When set to true, selected text will be copied to the primary clipboard.

[cursor]
style = {shape = "Block", blinking = "On"}

# URL detection: Ctrl+Shift+U opens hint mode, or Ctrl+click a link.
[[hints.enabled]]
binding = {key = "U", mods = "Control|Shift"}
command = "xdg-open"
hyperlinks = true
mouse = {enabled = true, mods = "Control"}
persist = false
post_processing = true
regex = '(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)\S+'
