name: shellcheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run shellcheck
        run: |
          shellcheck --version
          shellcheck -x $(git ls-files '*.sh')

      - name: Test config updates
        run: bash tests/config-update.sh
